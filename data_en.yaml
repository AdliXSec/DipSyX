__SHORT_MAP__:
  1. PRE-ENGAGEMENT PHASE: PRE-ENG
  2. INFORMATION GATHERING PHASE: RECON
  3. VULNERABILITY ANALYSIS PHASE (INFRASTRUCTURE & GENERAL): VULN-INFRA
  4. VULNERABILITY ANALYSIS PHASE - WEB APPLICATION SPECIFIC (OWASP): VULN-OWASP
  5. EXPLOITATION PHASE: EXPLOIT
  6. POST-EXPLOITATION PHASE: POST-EXP
  7. REPORTING PHASE: REPORT
  8. REMEDIATION VERIFICATION PHASE: REMEDIATE
  9. SPECIALIZED TESTING CONSIDERATIONS: SPECIAL
1. PRE-ENGAGEMENT PHASE:
- Secure the Non-Disclosure Agreement (NDA) document.
- Obtain formal and written authorization to conduct the testing.
- Ensure legal compliance with all relevant laws and regulations (e.g., GDPR, HIPAA).
- Obtain appropriate insurance coverage (e.g., professional liability insurance).
- Establish additional confidentiality agreements if necessary.
- Collect comprehensive client and system information.
- Clearly define the scope and rules of engagement.
- Identify in-scope and out-of-scope systems and applications.
- Confirm any limitations or constraints (e.g., testing time windows, sensitive systems).
- Agree on acceptable testing methodologies and tools.
- Establish safe testing periods to minimize business impact.
- Identify third-party systems and obtain necessary permissions.
- Establish specific and measurable success criteria.
- Establish emergency contacts and response protocols.
- Define data handling and storage protocols.
- Agree on how sensitive data will be stored, transmitted, and destroyed.
- Agree on communication channels and reporting frequency with the client.
- Set up regular check-in schedules and progress updates.
- Clarify the testing schedule and timeframe.
- Ensure the penetration testing team has the necessary expertise and certifications.
2. INFORMATION GATHERING PHASE:
- Perform WHOIS lookups and analyze domain registration information.
- Conduct DNS analysis and enumerate subdomains.
- Perform passive information gathering (e.g., Shodan, Censys).
- Utilize Open Source Intelligence (OSINT) techniques.
- Collect information from social media, public forums, and past data breaches.
- Review job postings to gain insights into the technologies and systems used by the
  target.
- Inspect code repositories (e.g., GitHub) for exposed code or credentials.
- Analyze SSL/TLS certificates for issuer details and expiration dates.
- Perform Google dorking to find potentially sensitive information.
- Conduct network and application scanning (e.g., Nmap, Nessus).
- Identify and enumerate all subdomains.
- Perform web crawling to search for hidden or dynamic content.
- Map network topology and identify network devices.
- Identify technologies, platforms, and frameworks used in the application.
- Check for common vulnerabilities (e.g., default credentials, unpatched systems).
- Check for information leakage via metadata, HTML comments, etc.
- Assess opportunities and methods for social engineering attacks.
- Monitor social media platforms for company-related disclosures.
- Collect employee and organizational information from public sources.
3. VULNERABILITY ANALYSIS PHASE (INFRASTRUCTURE & GENERAL):
- Validate and prioritize findings from automated scanning.
- Test known vulnerabilities and their potential for exploitation.
- Use vulnerability assessment tools to identify potential issues.
- Analyze applications for common flaws such as SQL Injection (SQLi), Cross-Site Scripting
  (XSS), Cross-Site Request Forgery (CSRF), Insecure Direct Object References (IDOR),
  and Insecure deserialization.
- Conduct fuzz testing to find new vulnerabilities.
- Review server and application configurations for misconfigurations.
- Perform manual code reviews if possible.
- Assess authentication and authorization mechanisms.
- Check for sensitive data exposure (e.g., in URLs, API responses).
- Inspect session management for weaknesses like session fixation.
- Test for security misconfigurations on network devices (firewalls, routers).
- Evaluate encryption and cryptographic practices, including SSL/TLS configurations.
- Assess APIs for vulnerabilities such as improper authentication.
- Assess the effectiveness of logging and monitoring controls.
- Inspect third-party components and libraries for vulnerabilities.
- Verify compliance with industry standards (e.g., OWASP Top Ten, NIST).
- Assess compliance with organizational security policies and procedures.
- Map findings to compliance requirements (e.g., PCI DSS, ISO 27001).
4. VULNERABILITY ANALYSIS PHASE - WEB APPLICATION SPECIFIC (OWASP):
- '[AppDOS] AppDOS-001 (Application Flooding): Ensure the application functions correctly
  when subjected to large volumes of requests, transactions, and/or network traffic.'
- '[AppDOS] AppDOS-002 (Application Lockout): Ensure the application does not allow
  an attacker to reset or lock out other users'' accounts.'
- '[Access Control] OWASP-AC-001 (Parameter Analysis): Ensure the application enforces
  the access control model by verifying that any parameter available to an attacker
  will not grant additional access.'
- '[Access Control] OWASP-AC-002 (Authorization): Ensure resources requiring authorization
  perform adequate authorization checks before being served to the user.'
- '[Access Control] OWASP-AC-003 (Authorization Parameter Manipulation): Ensure that
  after a user logs in, they cannot change the session ID parameter to reflect another
  user''s account.'
- '[Access Control] OWASP-AC-004 (Authorized pages/functions): Check if it is possible
  to access pages or functions that require login but can be bypassed.'
- '[Access Control] OWASP-AC-005 (Application Workflow): Ensure that when the application
  requires the user to perform actions in a specific sequence, that sequence is strictly
  enforced.'
- '[Authentication] OWASP-AUTHN-001 (Authentication HTTPS): Ensure users are only
  prompted to enter authentication credentials on pages served via SSL.'
- '[Authentication] OWASP-AUTHN-002 (Authentication bypass): Ensure the authentication
  process cannot be bypassed.'
- '[Authentication] OWASP-AUTHN-003 (Credentials transport): Ensure usernames and
  passwords are sent over an encrypted channel.'
- '[Authentication] OWASP-AUTHN-004 (Default Accounts): Check for the use of default
  account names and passwords.'
- '[Authentication] OWASP-AUTHN-005 (Username): Ensure the username is not public
  (or "wallet") information such as email or SSN.'
- '[Authentication] OWASP-AUTHN-006 (Password Quality): Ensure password complexity
  makes guessing difficult.'
- '[Authentication] OWASP-AUTHN-007 (Password Reset): Ensure the user must answer
  a secret question/answer or provide predetermined information before the password
  can be reset.'
- '[Auth-Session] OWASP-AUTHN-008 (Password Lockout): Ensure the user account is locked
  out for a specific period of time when an incorrect password is submitted more than
  a specified number of times (usually 5).'
- '[Auth-Session] OWASP-AUTHN-009 (Password Structure): Ensure special meta characters
  cannot be used within the password.'
- '[Auth-Session] OWASP-AUTHN-010 (Blank Passwords): Ensure passwords cannot be blank.'
- '[Auth-Session] OWASP-AUTHSM-001 (Session Token Length): Ensure the session token
  is of adequate length to provide protection against guessing during an authenticated
  session.'
- '[Auth-Session] OWASP-AUTHSM-002 (Session Timeout): Ensure session tokens are only
  valid for a predetermined timeframe after the user''s last request.'
- '[Auth-Session] OWASP-AUTHSM-003 (Session Reuse): Ensure session tokens are changed
  when a user moves from an SSL-protected resource to a non-SSL resource.'
- '[Auth-Session] OWASP-AUTHSM-004 (Session Deletion): Ensure the session token is
  invalidated when the user logs out.'
- '[Auth-Session] OWASP-AUTHSM-005 (Session Token Format): Ensure the session token
  is non-persistent and is never written to the browser history or cache.'
- '[Config Mgmt] OWASP-CM-001 (HTTP Methods): Ensure the web server does not support
  the ability to manipulate resources from the Internet (e.g., PUT and DELETE).'
- '[Config Mgmt] OWASP-CM-002 (Virtually Hosted Sites): Try to determine if the site
  uses virtual hosting.'
- '[Config Mgmt] OWASP-CM-003 (Known Vulnerabilities): Ensure known vulnerabilities
  that have been patched by the vendor are not present in the system.'
- '[Config Mgmt] OWASP-CM-004 (Back-up Files): Ensure no source code backup files
  are accessible in the publicly accessible parts of the application.'
- '[Config Mgmt] OWASP-CM-004 (Web Server Config): Ensure common configuration issues
  like directory listings and sample files have been resolved.'
- '[Config Mgmt] OWASP-CM-005 (Web Server Components): Ensure web server components
  like Front Page Server Extensions or Apache modules do not introduce security vulnerabilities.'
- '[Config Mgmt] OWASP-CM-006 (Common Paths): Check for the existence of common directories
  within the application (e.g., /backup and /admin).'
- '[Config Mgmt] OWASP-CM-007 (Language defaults): Check language/application defaults
  (e.g., J2EE quirks, availability of snoop.jsp, and loaded modules).'
- '[Config Mgmt] OWASP-CM-008 (Infra Admin Interfaces): Ensure administrative interfaces
  for infrastructure like web servers and application servers are not accessible from
  the Internet.'
- '[Config Mgmt] OWASP-CM-009 (App Admin Interfaces): Ensure administrative interfaces
  for the application are not accessible from the Internet.'
- '[Error Handling] OWASP-EH-001 (App Error Messages): Ensure the application does
  not display application error messages to an attacker that could be used in an attack
  (e.g., stack traces).'
- '[Error Handling] OWASP-EH-002 (User Error Messages): Ensure the application does
  not display user error messages to an attacker that could be used in an attack (e.g.,
  "User does not exist" or "Incorrect password").'
- '[Data Protection] OWASP-DP-001 (Sensitive Data in HTML): Ensure there is no sensitive
  data in the HTML (cached in browser history) that could lead an attacker to mount
  a focused attack.'
- '[Data Protection] OWASP-DP-002 (Data Storage): Ensure data is protected, where
  required, to maintain its confidentiality and integrity.'
- '[Data Protection] OWASP-DP-003 (SSL Version): Ensure the supported SSL versions
  do not possess cryptographic weaknesses.'
- '[Data Protection] OWASP-DP-004 (Key Exchange): Ensure the web server does not allow
  anonymous key exchange methods (e.g., ADH).'
- '[Data Protection] OWASP-DP-005 (SSL Algorithms): Ensure weak algorithms are not
  available (e.g., RC2 and DES).'
- '[Data Protection] OWASP-DP-006 (SSL Key Lengths): Ensure the website uses an appropriate
  key length (128-bit encryption recommended).'
- '[Data Protection] OWASP-DP-007 (Cert Validity): Ensure the application uses valid
  digital certificates (signature, host, and date valid).'
- '[Input Validation] OWASP-IV-001 (Script Injection): Ensure no part of the application
  that accepts input processes scripts as part of the input.'
- '[Input Validation] OWASP-IV-002 (SQL Injection): Ensure the application will not
  process SQL commands from the user.'
- '[Input Validation] OWASP-IV-003 (OS Command Injection): Ensure the application
  will not process operating system commands from the user.'
- '[Input Validation] OWASP-IV-004 (LDAP Injection): Ensure the application will not
  process LDAP commands from the user.'
- '[Input Validation] OWASP-IV-005 (Cross Site Scripting): Ensure the application
  will not store or reflect malicious script code.'
- '[Buffer Overflow] OWASP-BO-001 (Overflows): Ensure the application is not vulnerable
  to any buffer overflows.'
- '[Buffer Overflow] OWASP-BO-002 (Heap Overflows): Ensure the application is not
  vulnerable to heap overflows.'
- '[Buffer Overflow] OWASP-BO-003 (Stack Overflows): Ensure the application is not
  vulnerable to stack overflows.'
- '[Buffer Overflow] OWASP-BO-004 (Format Strings): Ensure the application is not
  vulnerable to format string overflows.'
5. EXPLOITATION PHASE:
- Attempt to gain initial access through Phishing campaigns (with explicit permission).
- Attempt to gain initial access by exploiting known vulnerabilities.
- Attempt to gain initial access using default or weak credentials.
- Utilize exploit frameworks (e.g., Metasploit) responsibly and within scope.
- Perform privilege escalation on compromised systems.
- Exploit application logic flaws and business logic vulnerabilities.
- Explore lateral movement within the network.
- Attempt to access other systems and resources.
- Attempt to bypass security controls such as WAF, 2FA, etc.
- Attempt to evade detection from security solutions such as antivirus and IDS/IPS.
- Use custom or zero-day exploits cautiously and with explicit permission.
- Document every step of the exploitation process meticulously.
- Maintain detailed logs of all actions for accountability and analysis.
- Ensure all exploitation steps are reproducible and verifiable.
6. POST-EXPLOITATION PHASE:
- Identify and access critical data stores.
- Analyze the potential business and technical impact of the exploited vulnerabilities.
- Evaluate the likelihood of real-world exploitation based on the findings.
- Implement strategies for maintaining access (persistence), if necessary and authorized.
- Remove all tools, scripts, and artifacts used during testing.
- Ensure no backdoors, test accounts, or persistence mechanisms are left behind.
- Verify that systems are reverted to their pre-testing state.
- Confirm that no sensitive data was altered or left exposed.
- Adhere to secure data handling and processing procedures.
- Check for clear-text credentials and sensitive data inside the memory.
- Simulate data exfiltration, if within the agreed scope.
- Document all system alterations comprehensively.
7. REPORTING PHASE:
- Create a detailed technical report documenting tools, techniques, and procedures
  used.
- Include evidence such as screenshots and logs.
- Provide clear and actionable remediation recommendations.
- Assign risk ratings to all identified vulnerabilities.
- Follow industry-standard reporting formats (e.g., PTES, NIST guidelines).
- Include a detailed methodology section explaining the testing approach.
- Provide references to relevant industry standards and best practices.
- Prepare an executive summary for stakeholder review.
- Include technical details and high-level overviews for different audiences.
- Ensure the report is appropriately classified and sensitive data is secured.
- Offer a prioritized action plan with clear deadlines for remediation.
- Conduct a read-out meeting with the client to discuss key findings.
- Suggest a timeline for follow-up assessments or retesting.
8. REMEDIATION VERIFICATION PHASE:
- Allow a designated period for the client to remediate identified issues.
- Conduct retests to verify the effectiveness of the fixes.
- Update the report with verification results and any new findings.
- Validate that security controls are now functioning as intended.
- Document any unresolved security issues.
- Recommend strategies for ongoing monitoring and continuous improvement.
- Assist in identifying root causes to prevent future vulnerabilities.
- Recommend improvements to security policies, procedures, and practices.
- Propose integrating security into the Software Development Life Cycle (SDLC).
- Advise on the need for security awareness and training programs.
- Propose a schedule for regular future security audits.
- Provide guidance on implementing a vulnerability management program.
9. SPECIALIZED TESTING CONSIDERATIONS:
- '[IoT Device] Analyze firmware for vulnerabilities.'
- '[IoT Device] Assess communication protocol security (e.g., MQTT, CoAP).'
- '[IoT Device] Perform hardware security testing (e.g., JTAG, UART interfaces).'
- '[IoT Device] Evaluate over-the-air (OTA) update security.'
- '[IoT Device] Check default configurations and hardcoded credentials.'
- '[IoT Device] Assess RF communication security (e.g., Bluetooth, Zigbee).'
- '[IoT Device] Review physical security controls.'
- '[Container] Analyze Docker security configurations.'
- '[Container] Assess Kubernetes cluster security.'
- '[Container] Perform container image scanning for vulnerabilities.'
- '[Container] Implement runtime security monitoring.'
- '[Container] Review service mesh configurations.'
- '[Container] Evaluate container orchestration security.'
- '[Container] Secure container registries.'
- '[CI/CD Pipeline] Secure source code management systems.'
- '[CI/CD Pipeline] Assess build pipeline security.'
- '[CI/CD Pipeline] Protect artifact repositories.'
- '[CI/CD Pipeline] Secure deployment processes.'
- '[CI/CD Pipeline] Evaluate Infrastructure as Code (IaC) security.'
- '[CI/CD Pipeline] Implement secrets management best practices.'
- '[CI/CD Pipeline] Enforce strict pipeline access controls.'
- '[Cloud] Conduct cloud configuration reviews.'
- '[Cloud] Assess Identity and Access Management (IAM) policies.'
- '[Cloud] Secure storage services (e.g., S3 buckets, Blob storage).'
- '[Cloud] Review network security groups and firewall settings.'
- '[Cloud] Evaluate serverless function security.'
- '[Cloud] Test for misconfigurations in cloud environments.'
- '[Cloud] Assess cloud-specific vulnerabilities and exploits.'
