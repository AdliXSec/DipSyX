"1. Reconnaissance & OSINT (Recon)":
  - "[bold cyan]Amass[/bold cyan]: In-depth DNS enumeration and network mapping. Sangat gacor untuk subdomain discovery mendalam."
  - "[bold cyan]Subfinder[/bold cyan]: Fast passive subdomain discovery. Sangat ringan dan sangat cepat."
  - "[bold cyan]Assetfinder[/bold cyan]: Tool simpel untuk mencari domains dan subdomains."
  - "[bold cyan]Findomain[/bold cyan]: Fast cross-platform subdomain enumerator."
  - "[bold cyan]httpx[/bold cyan]: Fast and multi-purpose HTTP toolkit. Wajib untuk probing status code, title, tech stack."
  - "[bold cyan]httprobe[/bold cyan]: Probing list domain untuk mencari server HTTP dan HTTPS yang hidup."
  - "[bold cyan]Naabu[/bold cyan]: Fast port scanner ditulis dalam Go. Sangat andal untuk mass network."
  - "[bold cyan]RustScan[/bold cyan]: Port scanner masa kini, jauh lebih cepat dari Nmap, nge-scan 65k port dalam hitungan detik."
  - "[bold cyan]Masscan[/bold cyan]: TCP port scanner asinkron, nge-scan seluruh internet dalam hitungan menit."
  - "[bold cyan]Gau (GetAllUrls)[/bold cyan]: Fetch known URLs dari OTX, Wayback Machine, dan Common Crawl."
  - "[bold cyan]Waybackurls[/bold cyan]: Ambil semua historical URL sebuah domain langsung dari Wayback Machine."
  - "[bold cyan]Katana[/bold cyan]: Next-generation crawling dan spidering framework dari ProjectDiscovery."
  - "[bold cyan]Hakrawler[/bold cyan]: Web crawler super cepat untuk mencari endpoint dan asset tersembunyi."
  - "[bold cyan]Shodan CLI[/bold cyan]: Mesin pencari IoT/Device. Wajib untuk OSINT pro."
  - "[bold cyan]Censys[/bold cyan]: Attack surface management dan search engine super detail."
  - "[bold cyan]Aquatone[/bold cyan]: Visual inspection/screenshotting otomatis untuk ratusan host sekaligus."
  - "[bold cyan]Eyewitness[/bold cyan]: Screenshotting tool andalan untuk web dan service RDP/VNC."
  - "[bold cyan]MassDNS[/bold cyan]: High-performance DNS stub resolver untuk nge-resolve ribuan subdomain seketika."
  - "[bold cyan]Altdns[/bold cyan]: Generator permutasi dan mutasi subdomain."

"2. Web Application Vulnerability & Fuzzing":
  - "[bold cyan]Burp Suite Professional[/bold cyan]: The gold standard. Raja-nya web application proxy dan scanner."
  - "[bold cyan]Caido[/bold cyan]: Lightweight proxy modern, alternatif Burp Suite berbasis Rust yang super ngebut."
  - "[bold cyan]Nuclei[/bold cyan]: Fast vulnerability scanner berbasis template YAML. Sangat OP untuk mass bug bounty."
  - "[bold cyan]Ffuf[/bold cyan]: Fast web fuzzer. Gacor buat directory bruteforcing dan fuzzing parameter."
  - "[bold cyan]Feroxbuster[/bold cyan]: Content discovery tool berbasis Rust, recursive dan super kencang."
  - "[bold cyan]Gobuster[/bold cyan]: Directory, File, DNS dan VHost busting tool klasik berbasis Go."
  - "[bold cyan]Dirsearch[/bold cyan]: Web path scanner legendaris."
  - "[bold cyan]Dalfox[/bold cyan]: Parameter Analysis dan XSS Scanning super ganas berbasis Go."
  - "[bold cyan]XSStrike[/bold cyan]: Advanced XSS detection suite dengan algoritma payload parsing cerdas."
  - "[bold cyan]Arjun[/bold cyan]: HTTP parameter discovery suite andalan. Wajib pakai buat nyari hidden parameter!"
  - "[bold cyan]ParamSpider[/bold cyan]: Parameter discovery andalan para bug hunter."
  - "[bold cyan]SQLmap[/bold cyan]: Automatic SQL injection and database takeover tool."
  - "[bold cyan]Ghauri[/bold cyan]: Advanced SQL injection tool penerus/alternatif SQLmap."
  - "[bold cyan]Commix[/bold cyan]: Automated All-in-One OS command injection and exploitation tool."
  - "[bold cyan]Wfuzz[/bold cyan]: Tool andalan buat web fuzzing kompleks."
  - "[bold cyan]GraphQL-cop[/bold cyan]: Tool andalan untuk mencari celah/security misconfig di GraphQL."
  - "[bold cyan]JWT_Tool[/bold cyan]: Toolkit pro untuk testing, tweaking, dan cracking JWT (JSON Web Tokens)."
  - "[bold cyan]CRLFuzz[/bold cyan]: Tool sakti pencari celah CRLF berbasis Go."
  - "[bold cyan]Smuggler[/bold cyan]: HTTP Request Smuggling / Desync testing tool."

"3. Network Security & Active Directory":
  - "[bold cyan]CrackMapExec (NetExec)[/bold cyan]: Swiss army knife buat pentest jaringan dan Active Directory."
  - "[bold cyan]BloodHound[/bold cyan]: Visualisasi 'Six Degrees of Domain Admin', nyawa-nya pentest AD."
  - "[bold cyan]Responder[/bold cyan]: LLMNR, NBT-NS dan MDNS poisoner. Cepat banget dapet NTLMv2 hash."
  - "[bold cyan]Impacket[/bold cyan]: Koleksi script maut (Psexec, Wmiexec, Secretsdump) buat interaksi protokol jaringan Windows."
  - "[bold cyan]Nmap[/bold cyan]: Legenda port scanner untuk deep scanning & service enumeration."
  - "[bold cyan]Enum4linux-ng[/bold cyan]: Tool modern pengganti enum4linux untuk enumerasi SMB/Samba."
  - "[bold cyan]Kerbrute[/bold cyan]: Enumerasi dan bruteforce AD accounts murni lewat Kerberos Pre-Auth tanpa berisik."
  - "[bold cyan]Rubeus[/bold cyan]: Toolset manipulasi dan abuse Kerberos (Pass-the-Ticket, Kerberoasting)."
  - "[bold cyan]Certipy[/bold cyan]: Tool wajib untuk abuse ADCS (Active Directory Certificate Services)."
  - "[bold cyan]Coercer[/bold cyan]: Script otomatis untuk nge-coerce Windows server supaya ngasih autentikasi."
  - "[bold cyan]PetitPotam[/bold cyan]: Exploit andalan buat coerce autentikasi MS-EFSRPC."

"4. Privilege Escalation & Pivoting":
  - "[bold cyan]LinPEAS[/bold cyan]: Script sakti enumerasi Privilege Escalation di Linux."
  - "[bold cyan]WinPEAS[/bold cyan]: Script sakti enumerasi Privilege Escalation di Windows."
  - "[bold cyan]Traitor[/bold cyan]: Tool otomatis exploit low-hanging fruit privesc di Linux."
  - "[bold cyan]Seatbelt[/bold cyan]: Enumerasi miskonfigurasi keamanan tingkat lanjut di Windows (GhostPack)."
  - "[bold cyan]Pspy[/bold cyan]: Monitor proses linux yang jalan di background tanpa butuh akses root."
  - "[bold cyan]Chisel[/bold cyan]: TCP/UDP tunnel over HTTP super stabil untuk pivoting."
  - "[bold cyan]Ligolo-ng[/bold cyan]: Advanced tunneling/pivoting tool pakai TUN interfaces. Terasa kaya VPN lokal, jauh lebih OP dari proxychains."
  - "[bold cyan]PrintSpoofer[/bold cyan]: Exploit sakti buat eskalasi dari Service Account ke SYSTEM."
  - "[bold cyan]GodPotato[/bold cyan]: Tool keluarga Potato terbaru buat nyikat privesc Windows."
  - "[bold cyan]Mimikatz[/bold cyan]: Maestro untuk nge-dump plaintext password, hash, dan kerberos ticket dari LSASS memory."
  - "[bold cyan]Sudo_killer[/bold cyan]: Pencari miskonfigurasi sudo dan exploit yang mematikan di Linux."

"5. Post-Exploitation & Command/Control (C2)":
  - "[bold cyan]Cobalt Strike[/bold cyan]: Standar industri Red Teaming tingkat tinggi."
  - "[bold cyan]Sliver[/bold cyan]: C2 open-source dari BishopFox berbasis Go, sangar buat adversary emulation."
  - "[bold cyan]Mythic[/bold cyan]: Framework C2 modern, cross-platform, dengan UI web browser yang sangat canggih."
  - "[bold cyan]Havoc[/bold cyan]: C2 framework modern dan malleable buat bypass EDR modern."
  - "[bold cyan]Metasploit Framework[/bold cyan]: Framework eksploitasi raksasa yang masih jadi nyawa pentester."
  - "[bold cyan]Covenant[/bold cyan]: C2 framework kolaboratif berbasis .NET (berguna buat in-memory .NET assembly execution)."
  - "[bold cyan]Empire[/bold cyan]: PowerShell dan Python post-exploitation agent."
  - "[bold cyan]PoshC2[/bold cyan]: Proxy-aware C2 framework yang gila banget lewat PowerShell."
  - "[bold cyan]Merlin[/bold cyan]: Cross-platform C2 server pakai HTTP/2, sulit dideteksi."
